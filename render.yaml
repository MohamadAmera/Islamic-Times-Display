services:
  - type: web
    name: islamic-times-api
    env: node
    buildCommand: pnpm install && bash build-prod.sh
    startCommand: node artifacts/api-server/dist/index.cjs
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
