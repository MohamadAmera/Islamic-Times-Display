packages:
  "framer-motion": "For page transitions, countdown animations, and smooth Qibla compass rotation"
  "date-fns": "For easier time manipulation and formatting"
  "react-hook-form": "For the admin dashboard forms"
  "@hookform/resolvers": "For Zod validation integration in admin forms"
  "zod": "For admin form schema validation"

images:
  - path: "artifacts/al-noor/public/images/pattern.png"
    description: "Seamless Islamic eight-point star geometric pattern, extremely subtle and elegant, dark navy background with faint gold outlines, premium aesthetic"
    aspect_ratio: "16:9"
  - path: "artifacts/al-noor/public/images/kaaba.png"
    description: "Elegant minimalist illustration of the Kaaba in Mecca, dark mode, subtle gold accents, flat vector style"
    aspect_ratio: "1:1"

notes:
  - API hooks are imported from @workspace/api-client-react
  - The app uses Intl.DateTimeFormat for Hijri dates, which is natively supported in modern browsers
  - Background audio requires user interaction first due to browser autoplay policies
